name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ "17", "21" ]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # `verify` runs the JUnit 5 suite and the JaCoCo >=90% line-coverage gate. The JMS
      # interfaces (Session/Producer/Consumer/Message) are mocked with Mockito — no Artemis,
      # no network.
      - name: Test
        run: mvn -B --no-transfer-progress verify

  # Opt-in live-broker tests (Artemis service container). Runs on push to main and on manual
  # dispatch only; it is deliberately NOT in `ci-green` needs, so it is never a required check.
  integration:
    name: Integration (live Artemis)
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      artemis:
        image: apache/activemq-artemis:2.37.0
        ports:
          - 61616:61616
        env:
          ARTEMIS_USER: artemis
          ARTEMIS_PASSWORD: artemis
        options: >-
          --health-cmd "/var/lib/artemis-instance/bin/artemis check node --up --user artemis --password artemis"
          --health-interval 10s --health-timeout 10s --health-retries 12 --health-start-period 20s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Integration tests
        env:
          BQ_INTEGRATION: "1"
          BQ_ARTEMIS_URL: tcp://localhost:61616
          BQ_ARTEMIS_USER: artemis
          BQ_ARTEMIS_PASSWORD: artemis
        run: mvn -B --no-transfer-progress test -Dtest=ArtemisIntegrationTest

  conformance:
    name: Conformance suite in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify vendored conformance matches the canonical suite
        run: |
          git clone --depth 1 --branch v1.2.0 https://github.com/BabelQueue/conformance.git "$RUNNER_TEMP/conformance"
          diff -u "$RUNNER_TEMP/conformance/CONFORMANCE_VERSION" "src/test/resources/conformance/CONFORMANCE_VERSION"
          diff -ru "$RUNNER_TEMP/conformance/manifest.json" "src/test/resources/conformance/manifest.json"
          diff -ru "$RUNNER_TEMP/conformance/fixtures"      "src/test/resources/conformance/fixtures"
          diff -ru "$RUNNER_TEMP/conformance/schema"        "src/test/resources/conformance/schema"
          echo "Vendored conformance is in sync with the canonical suite."

  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    needs: [test, conformance]
    if: ${{ always() }}
    steps:
      - name: Fail if any required job did not pass
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
